name: CI & Security

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- App CI (static analysis, tests) ----------
  build-test-scan:
    name: CI Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: xdebug
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: JavaScript interaction tests
        run: npm run test:js
      # PHP coding standard
      - name: PHPCS
        run: composer phpcs
      # PHPStan
      - name: PHPStan (root)
        run: composer phpstan
      # PHPUnit
      - name: PHPUnit (root)
        run: php vendor/bin/phpunit --coverage-clover coverage.xml
      - name: ESLint
        run: npm run lint:js
      - name: Stylelint
        run: npm run lint:css
  # ---------- Security: CodeQL (JS) ----------
  codeql-js:
    name: CodeQL (JavaScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript
          config: |
            paths-ignore:
              - vendor/**
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"


  # ---------- Security: Semgrep (PHP) with pip cache ----------
  semgrep-php:
    name: Semgrep (PHP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (with pip cache)
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: 'requirements-semgrep.txt'

      - name: Install Semgrep
        run: pip install -r requirements-semgrep.txt

      - name: Run Semgrep (PHP) and output SARIF
        run: |
          semgrep --config=p/php \
                  --include root \
                  --exclude vendor \
                  --exclude node_modules \
                  --exclude dist \
                  --sarif --output=semgrep.sarif

      - name: Sanitize Semgrep SARIF for GitHub Code Scanning
        run: |
          if [ -f semgrep.sarif ]; then
            tmp_file="$(mktemp)"
            jq '(.runs[]?.results[]? |= (del(.fingerprints)))' semgrep.sarif > "$tmp_file"
            mv "$tmp_file" semgrep.sarif
          fi

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

  # ---------- PR auto-fix ----------
  lint-fix:
    name: Prepare lint fixes for PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: PHPCBF
        run: composer phpcbf || true
      - name: ESLint Fix
        run: node node_modules/eslint/bin/eslint.js 'root/**/*.js' --ignore-pattern 'vendor/**' --ignore-pattern 'root/vendor/**' --fix || true
      - name: Stylelint Fix
        run: node node_modules/stylelint/bin/stylelint.mjs 'root/**/*.css' --ignore-pattern 'vendor/**' --ignore-pattern 'root/vendor/**' --fix || true
      - name: Save proposed fixes
        run: git diff --binary > auto-fixes.patch
      - name: Upload proposed fixes
        uses: actions/upload-artifact@v4
        with:
          name: lint-fixes
          path: auto-fixes.patch
          if-no-files-found: error
