name: CI & Security

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- App CI (static analysis, tests) ----------
  build-test-scan:
    name: CI Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: xdebug
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: JavaScript interaction tests
        run: npm run test:js
      # PHP coding standard
      - name: PHPCS
        run: composer phpcs
      # PHPStan
      - name: PHPStan (root)
        run: composer phpstan
      # PHPUnit
      - name: PHPUnit (root)
        run: vendor/bin/phpunit --coverage-clover coverage.xml
      - name: ESLint
        run: npm run lint:js
      - name: Stylelint
        run: npm run lint:css
  # ---------- Security: CodeQL (JS) ----------
  codeql-js:
    name: CodeQL (JavaScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript
          config: |
            paths-ignore:
              - vendor/**
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"


  # ---------- Security: Semgrep (PHP) with pip cache ----------
  semgrep-php:
    name: Semgrep (PHP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep (PHP) and output SARIF
        run: |
          semgrep --config=p/php \
                  --include root \
                  --exclude vendor \
                  --exclude node_modules \
                  --exclude dist \
                  --sarif --output=semgrep.sarif

      - name: Sanitize Semgrep SARIF for GitHub Code Scanning
        run: |
          if [ -f semgrep.sarif ]; then
            tmp_file="$(mktemp)"
            jq '(.runs[]?.results[]? |= (del(.fingerprints)))' semgrep.sarif > "$tmp_file"
            mv "$tmp_file" semgrep.sarif
          fi

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
